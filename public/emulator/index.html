<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Emulator</title>
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
      #game { width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script>
      // Isolated EmulatorJS host. The Next.js app embeds this page in an iframe
      // so each game gets a clean page (EmulatorJS relies on window globals).
      var params = new URLSearchParams(location.search);
      window.EJS_player = "#game";
      window.EJS_core = params.get("core");
      window.EJS_gameUrl = params.get("rom");
      window.EJS_gameName = params.get("name") || "game";
      window.EJS_color = params.get("color") || "#5b45c8";
      window.EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";
      window.EJS_startOnLoaded = true;
      window.EJS_backgroundColor = "#000";
    </script>
    <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
  </body>
</html>
